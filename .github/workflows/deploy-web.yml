name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/4.7.1.stable
          key: godot-4.7.1
      - if: steps.godot-cache.outputs.cache-hit != 'true'
        run: scripts/ci-install-godot.sh
      - run: echo "GODOT=$HOME/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run e2e
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: output

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
